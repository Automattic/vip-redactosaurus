# .github/workflows/release.yml
name: Release extension
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r redactosaurus.zip . -x ".git/*" ".github/*"
      - run: gh release create "$GITHUB_REF_NAME" redactosaurus.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
